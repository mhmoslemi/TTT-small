problem: gpu_mode
problem_type: trimul

# --- problem-specific ---
score_scale: 1500
gpu_type: H100
target: 1000
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
kernel_log_chars: 4000        # compiler/test output captured as feedback f_i

# --- model / backend ---
model_name: "openai/gpt-oss-120b"
backend: auto
max_seq_length: 32000

# --- reward evaluation ---
# MUST be 1. The reward here is a measured runtime, and concurrent benchmark
# runs contend for the GPU and produce noise that the group-relative advantage
# then treats as signal. The default (0 = auto) spawns cpu_count - num_gpus
# threads, which is right for a subprocess sandbox and wrong for this.
reward_workers: 1
sandbox_timeout_s: 1300
kernel_timeout_s: 900         # 0 = use sandbox_timeout_s. A hung kernel is
                              # killed rather than blocking the step forever.
kernel_gpu_id: 1              # PHYSICAL device the benchmark owns. Must not
                              # appear in gpu_ids and must not be the training
                              # GPU: the reward is a runtime, so anything else
                              # on that device is measured as part of it.

# --- RL ---
# Batch sizes are far below circle packing on purpose. Each rollout compiles and
# benchmarks a Triton kernel, tens of seconds serialized, against about a second
# for a packing. 8x64 would put a step in the hours.
num_steps: 30
groups_per_step: 4
group_size: 8                 # 32 rollouts/step
num_seed_states: 8
learning_rate: 4.0e-5
kl_penalty_coef: 0.1
max_new_tokens: 16000
temperature: 1.0
top_p: 1.0

# --- generation ---
num_gpus: 1
gpu_ids: "0"        # 0 trains, 7 benchmarks, these six generate

# --- memory (Sec. 2.2) ---
memory: true
memory_hygiene_profile: kernel   # auto resolves to this from the problem name
memory_extract_mode: contrast
memory_lessons_per_call: 3
memory_max_examples_per_call: 6
memory_max_chars_per_example: 2500   # kernels are longer than packings
memory_feedback_chars: 1500          # compiler errors are the useful part
memory_max_new_tokens: 2024
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false
memory_lookup_mode: select
memory_lookup_max_select: 5
memory_lookup_fallback: none
memory_catalog_max_lessons: 0
memory_curate_every: 5
memory_curate_max_items: 60
memory_curate_min_keep_frac: 0.25
memory_max_lessons: 500
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_token_budget: 2400
memory_grant_context: true
memory_inject_mode: append

# --- feedback-based failure signal (Sec. 2.3) ---
feedback: true
feedback_lambda: 0.2
feedback_anneal_steps: 10
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 2000          # keep more of the traceback than circle packing
feedback_max_per_step: 0
feedback_inject_mode: append