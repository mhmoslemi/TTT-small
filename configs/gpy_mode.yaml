# Complete standalone configuration. No shared defaults file is merged.

# --- problem / targets ---
problem: gpu_mode
problem_type: trimul
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
target: 1000
fail_score: 0.0
score_scale: 1500

# --- models / training backend ---
model_name: Qwen/Qwen3-8B
training_model_name: ''
# Coder context/output limits are derived from the selected model.
# GPT-OSS uses low reasoning effort from its profile in train_multy_CVaR.py.
coder_model_name: openai/gpt-oss-120b
coder_training_model_name: ''
# strategy_model_name: openai/gpt-oss-20b
strategy_model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
# Additional frozen local strategists (aliases select NVIDIA NVFP4 weights):
# strategy_model_name: qwen3.8-flash-next
#   -> nvidia/Qwen3.8-Flash-Next-NVFP4 (~124 GiB checkpoint)
# strategy_model_name: deepseek-v4-flash-0731
#   -> nvidia/DeepSeek-V4-Flash-0731-NVFP4 (~155 GiB checkpoint)
# Full Hub IDs / local paths are also accepted and are not redirected.
# Require a recent vLLM >=0.30 build with current NVFP4 / SM120 support.
# Empty selects the local strategist above; set a model name to enable the API.
api_strategy: ''
strategy_backend: local
backend: auto
load_in_4bit: false  # Preserve GPT-OSS's native MXFP4; true selects NF4/BnB.
training_layout: replicated

# --- LoRA adapters ---
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- rollout budget / strategy allocation ---
num_steps: 30
groups_per_step: 4
group_size: 12
strategies_per_parent: 4
programs_per_strategy: 3
pilot_programs_per_strategy: -1
# Qwen3.8 only: pilot effort counts; unassigned pilots use the base effort.
# Phase-2 counts below apply when adaptive pilots are enabled.
pilot_medium_programs_per_strategy: 0
pilot_xhigh_programs_per_strategy: 0
# Qwen3.8 phase 2, per strategy: -1 fills the remainder (at most one -1).
# Fixed counts are capped by the allocation: xhigh, then medium, then low.
# With no -1, unassigned rollouts use base effort. Current YAML applies on resume.
phase2_low_programs_per_strategy: 0
phase2_medium_programs_per_strategy: 0
phase2_xhigh_programs_per_strategy: 0

# --- parent selection / strategy archive ---
# puct = original picker; uct = no rank prior.
# llm = GPT-6 Luna (reasoning=max): best raw-score anchor, then tree-guided picks.
# Parent count is groups_per_step; API key: OPENAI_API_KEY or .openai_api_key.
parent_selection: puct
num_seed_states: 8
seed_from_reference: true
puct_c: 1.0
max_buffer_size: 1000
topk_children_per_parent: 8
strategy_archive_top_r: 2

# --- optimizer / training batches ---
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
grad_clip: 1.0
train_examples_per_microbatch: 64
logprob_chunk: auto

# --- advantage / regularization ---
kl_penalty_coef: 0.1
# true: historical arctan shaping, 25% wider, with SPO moving average.
# false: original exp(beta * reward) SPO. Both train on every rollout.
spo_rs_adaptive_beta: false
spo_rs_beta: 2.0

# --- coder sampling ---
temperature: 1.0
top_p: 1.0
top_k: 0
thinking: true

# --- strategy sampling / validation ---
# auto uses the model ceiling (DeepSeek V4 capped at 262144); output subtracts prompt.
strategy_max_seq_length: auto
strategy_max_new_tokens: auto
# Unfiltered sampling; model profiles and retries preserve these values.
strategy_temperature: 1
strategy_top_p: 1
strategy_top_k: 0
strategy_min_p: 0
strategy_thinking: true
# auto keeps R1's existing high label; Qwen Flash-Next defaults to xhigh,
# DeepSeek V4 0731 to max. Or explicitly select an official model level:
# Qwen Flash-Next: low / medium / xhigh; DeepSeek V4 0731: low / high / max.
# Default ceilings: R1 131072; Qwen Flash-Next 262144; DeepSeek V4 0731 262144.
# Other models: auto retains the previous high default.
strategy_reasoning_effort: auto
# Additional format retries; use a direct-solve fallback if all attempts fail.
strategy_format_max_retries: 3
# false restores the previous complete/non-empty <strategy> block validation.
strict_strategy_validation: false

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
available_gpu_ids: ''
training_gpu_id: 0
gpu_ids: ''
num_gpus: null
evaluation_gpu_id: null
reserve_last_gpu_for_evaluation: false
sequential_generation: false
evaluation_shares_generation: false

# --- coder generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: false
vllm_quantization: ''
vllm_gpu_memory_utilization: auto
vllm_max_num_batched_tokens: auto
vllm_enable_prefix_caching: true
vllm_enforce_eager: false
vllm_sleep_level: 1
vllm_staged_loading: true

# --- strategy generation engine ---
strategy_vllm_quantization: ''
strategy_vllm_sleep_level: 1
strategy_vllm_staged_loading: false

# --- reproducibility ---
deterministic: false
seed: 42

# --- evaluation ---
gpu_type: H100
triton_version: 3.3.1
gpu_lease_timeout_s: 0
kernel_timeout_s: 900
sandbox_timeout_s: 1300
reward_workers: 1

# --- logging / saved outputs ---
print_responses: 0
max_saved_construction: 40960
kernel_log_chars: 4000
show_launch_note: true
