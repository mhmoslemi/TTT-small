
problem: gpu_mode
problem_type: mla_decode_nvidia

# --- problem-specific ---
score_scale: 5000
gpu_type: H100
target: 1700          
task_yaml: examples/gpu_mode/lib/mla-decode/task.yml
lib_dir: examples/gpu_mode/lib

model_name: "openai/gpt-oss-120b"
backend: unsloth
generation_backend: vllm

# --- sandbox ---
sandbox_timeout_s: 1300
reward_workers: 1

# --- RL ---
max_new_tokens: 26000

# --- isolated 7x H100 layout ---
available_gpu_ids: "0,1,2,3,4,5,6"
training_gpu_id: 0
gpu_ids: "1,2,3,4"
vllm_tensor_parallel_size: 4
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: true
reserve_last_gpu_for_evaluation: true
