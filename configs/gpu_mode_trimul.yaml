# Complete standalone configuration. No shared defaults file is merged.

# --- problem / routing ---
problem: gpu_mode
problem_type: trimul
target: 1000
fail_score: 0.0
score_scale: 1500
gpu_type: H100
gpu_lease_timeout_s: 0
triton_version: 3.3.1
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
kernel_log_chars: 4000
kernel_timeout_s: 900
show_launch_note: true
seed_from_reference: true

# --- model / QLoRA training ---
model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct
training_model_name: ''
coder_model_name: Qwen/Qwen2.5-Coder-7B-Instruct
coder_training_model_name: ''
# strategy_model_name: openai/gpt-oss-20b
strategy_model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
backend: unsloth
max_seq_length: 32000
load_in_4bit: true
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
binary_coder_training: false
binary_coder_init_steps: 2
binary_coder_lora_rank: 16
binary_coder_clip_epsilon_low: 0.2
binary_coder_clip_epsilon_high: 0.38
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
training_gpu_id: 0
available_gpu_ids: ''
reserve_last_gpu_for_evaluation: false
evaluation_gpu_id: null
num_gpus: null
gpu_ids: ''
sequential_generation: false
evaluation_shares_generation: false

# --- generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_gpu_memory_utilization: auto
vllm_enforce_eager: false
vllm_enable_prefix_caching: true
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_quantization: ''
vllm_max_num_batched_tokens: auto
vllm_enable_expert_parallel: false
vllm_sleep_level: 1
vllm_staged_loading: true
strategy_vllm_sleep_level: 1
strategy_vllm_staged_loading: false

# --- optimization ---
num_steps: 30
groups_per_step: 4
group_size: 12
strategies_per_parent: 4
programs_per_strategy: 3
pilot_programs_per_strategy: -1
strategy_archive_top_r: 2
num_seed_states: 8
max_groups_per_step: null
max_group_size: null
growth_force_step: 10
growth_valid_yield: 0.7
growth_distinct_min: 4
growth_factor: 2.0
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
kl_penalty_coef: 0.1
grad_clip: 1.0
train_examples_per_microbatch: 64
logprob_chunk: auto

# --- search / PUCT ---
puct_c: 1.0
max_buffer_size: 1000
topk_children_per_parent: 8

# --- sampling ---
max_new_tokens: 8000
temperature: 1.0
top_p: 1.0
top_k: 0
thinking: false
strategy_max_new_tokens: 131072
# Additional format retries after the initial strategy attempt; stop if exhausted.
strategy_format_max_retries: 3
strategy_max_seq_length: 131072
strategy_temperature: 0.6
strategy_top_p: 0.95
strategy_top_k: 0
strategy_thinking: true
# Maximum runner effort; R1-0528 itself always reasons.
strategy_reasoning_effort: high
strategy_vllm_quantization: ''
deterministic: false
seed: 42

# --- evaluation / logging ---
sandbox_timeout_s: 100
reward_workers: 1
print_responses: 0
max_saved_construction: 4096

# --- feedback ---
feedback: true
feedback_lambda: 0.5
feedback_anneal_steps: 5
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 2000
feedback_max_per_step: 0
feedback_auto_fraction: 0.2
feedback_include_constant_groups: true
feedback_inject_mode: append
feedback_normalize: false
feedback_adaptive: false
feedback_validity_floor: 0.5
feedback_validity_target: 0.9
feedback_max_reward_ratio: 0.0
feedback_reward_scale_floor: 0.25
feedback_max_per_signature: 0
feedback_auto_signature_fraction: 0.25
