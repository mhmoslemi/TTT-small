problem: gpu_mode
problem_type: trimul

# --- hardware ---
gpu_type: H100                 # default kernel target and prompt architecture
triton_version: "3.3.1"

# --- problem-specific ---
# target and score_scale are DERIVED from gpu_type (H100 numbers scaled by
# memory bandwidth), so --gpu-type alone is enough. Uncomment and set them once
# you have benchmarked a real kernel; an explicit value always wins.
# target: 3900
# score_scale: 5820
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
kernel_log_chars: 4000

# --- model / backend ---
model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
backend: unsloth
generation_backend: vllm

# --- reward evaluation ---
reward_workers: 1              # MUST be 1: the reward is a measured runtime
sandbox_timeout_s: 100
kernel_timeout_s: 900          # hung kernel is killed, not left to block the step

# --- RL ---
num_steps: 30
groups_per_step: 4
group_size: 12                 # 48 kernel builds+benchmarks per step, serialized
max_new_tokens: 8000

# --- isolated 7x H100 layout ---
# GPU 0 trains, GPUs 1..4 form one tensor-parallel vLLM engine, GPU 6 is
# evaluation-only, and GPU 5 remains free. The reservation resolves
# kernel_gpu_id=6 and overlap validation prevents any other role touching it.
available_gpu_ids: "0,1,2,3,4,5,6"
training_gpu_id: 0
gpu_ids: "1,2,3,4"
vllm_tensor_parallel_size: 4
vllm_pipeline_parallel_size: 1
reserve_last_gpu_for_evaluation: true

# --- memory (Sec. 2.2) ---
memory: true
memory_hygiene_profile: kernel
memory_max_examples_per_call: 6
memory_max_chars_per_example: 2500
memory_feedback_chars: 1500
memory_max_new_tokens: 2024
memory_curate_every: 5
memory_token_budget: 2400

# --- feedback-based failure signal (Sec. 2.3) ---
feedback: true
feedback_lambda: 0.5
feedback_anneal_steps: 5
feedback_chars: 2000
