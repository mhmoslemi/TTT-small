problem: gpu_mode
problem_type: trimul           # trimul seeds from empty code; mla seeds from an
                               # H200 measurement and needs mla_seed_runtime_us

# --- hardware ---
gpu_type: L40S                 # drives the prompt's arch notes and its rules line
triton_version: "3.3.1"

# --- problem-specific ---
# target and score_scale are DERIVED from gpu_type (H100 numbers scaled by
# memory bandwidth), so --gpu-type alone is enough. Uncomment and set them once
# you have benchmarked a real kernel; an explicit value always wins.
# target: 3900
# score_scale: 5820
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
kernel_log_chars: 4000

# --- model / backend ---
# model_name: "Qwen/Qwen3-8B"
model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"




backend: hf
# backend: auto
max_seq_length: 32000 # 32000

# --- reward evaluation ---
reward_workers: 1              # MUST be 1: the reward is a measured runtime
sandbox_timeout_s: 100
# sandbox_timeout_s: 5
kernel_timeout_s: 900          # hung kernel is killed, not left to block the step
# kernel_timeout_s: 10          # hung kernel is killed, not left to block the step
kernel_gpu_id: 1               # PHYSICAL device the benchmark owns, exclusively

# --- RL ---
num_steps: 30
groups_per_step: 4
group_size: 12                 # 48 kernel builds+benchmarks per step, serialized
num_seed_states: 8
learning_rate: 4.0e-5
kl_penalty_coef: 0.1
max_new_tokens: 8000 #8000           # 16000 x group_size 12 overflows one 48 GB card:
                               # Qwen3-8B is ~147 KB of KV per token, so 12 x 20k
                               # tokens is ~35 GB on top of ~16 GB of weights.
                               # generate_responses halves the batch on OOM, so a
                               # larger value degrades to slow rather than fatal.
temperature: 1.0
top_p: 1.0

# --- generation ---
# Two GPUs: 0 trains AND generates, 1 benchmarks.
# num_gpus: 1 takes the single-GPU path, so there is no worker pool and
# generation runs in-process on the training model. gpu_ids is then unused.
num_gpus: 1
gpu_ids: "0"

# --- memory (Sec. 2.2) ---
memory: true
memory_hygiene_profile: kernel
memory_extract_mode: contrast
memory_lessons_per_call: 3
memory_max_examples_per_call: 6
memory_max_chars_per_example: 2500
memory_feedback_chars: 1500
memory_max_new_tokens: 2024
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false
memory_lookup_mode: select
memory_lookup_max_select: 5
memory_lookup_fallback: none
memory_catalog_max_lessons: 0
memory_curate_every: 5
memory_curate_max_items: 60
memory_curate_min_keep_frac: 0.25
memory_max_lessons: 500
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_token_budget: 2400
memory_grant_context: true
memory_inject_mode: append

# --- feedback-based failure signal (Sec. 2.3) ---
feedback: true
feedback_lambda: 0.5
feedback_anneal_steps: 5
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 2000
feedback_max_per_step: 0
feedback_inject_mode: append