
problem: denoising
single_cell: true

# --- problem-specific ---
target: 0.97
eval_seed: 42
# Code has a 400s internal time budget; paper eval_timeout=530.
sandbox_timeout_s: 530
max_new_tokens: 26000

# --- 7x H100 layout: QLoRA on GPU 0, one TP=4 vLLM engine on 1..4 ---
model_name: "openai/gpt-oss-120b"
backend: unsloth
generation_backend: vllm
available_gpu_ids: "0,1,2,3,4,5,6"
training_gpu_id: 0
gpu_ids: "1,2,3,4"
vllm_tensor_parallel_size: 4
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: true
