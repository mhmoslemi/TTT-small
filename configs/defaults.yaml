# Complete repository-wide defaults. Python contains no duplicate value table.
# Precedence: this file < problem YAML < resumed config < explicit CLI.

# --- problem routing ---
problem: circle_packing
problem_type: ""
num_circles: 26
target: null

# --- model / QLoRA training ---
model_name: "Qwen/Qwen3-8B"
backend: auto
max_seq_length: 32000
load_in_4bit: true
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- GPU roles ---
# Physical ids. Problem files define the inventory and generation group for the
# machine they target. The trainer is always narrowed to one logical cuda:0.
training_gpu_id: 0
available_gpu_ids: ""
reserve_last_gpu_for_evaluation: false
evaluation_gpu_id: null
num_gpus: null
gpu_ids: ""

# --- generation engine ---
generation_backend: hf
gen_micro_batch: 0
vllm_gpu_memory_utilization: 0.82
vllm_enforce_eager: false
vllm_enable_prefix_caching: true
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
# Empty/auto means checkpoint-native quantization. This is deliberately not
# coupled to load_in_4bit, which applies only to the training copy.
vllm_quantization: ""
vllm_max_num_batched_tokens: 0
vllm_enable_expert_parallel: false

# --- optimization ---
num_steps: 50
groups_per_step: 8
group_size: 64
num_seed_states: 8
max_groups_per_step: null
max_group_size: null
growth_force_step: 10
growth_valid_yield: 0.7
growth_distinct_min: 4
growth_factor: 2.0
learning_rate: 4.0e-5
kl_penalty_coef: 0.1
grad_clip: 1.0
train_examples_per_microbatch: 64
logprob_chunk: 0

# --- search / PUCT ---
puct_c: 1.0
max_buffer_size: 1000
topk_children_per_parent: 8

# --- sampling ---
max_new_tokens: 4200
temperature: 1.0
top_p: 1.0
thinking: false
deterministic: false
seed: 42

# --- evaluation / logging ---
sandbox_timeout_s: 30.0
reward_workers: 0
print_responses: 0
max_saved_construction: 4096

# --- memory defaults (problem YAMLs only override intentional differences) ---
memory: false
memory_extract_mode: contrast
memory_lessons_per_call: 3
memory_max_examples_per_call: 8
memory_max_chars_per_example: 1500
memory_feedback_chars: 800
memory_max_new_tokens: 1024
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false
memory_lookup_mode: select
memory_lookup_max_select: 5
memory_lookup_fallback: none
memory_lookup_max_new_tokens: 256
memory_lookup_temperature: 0.3
memory_catalog_max_lessons: 0
memory_catalog_chars: 200
memory_curate_every: 0
memory_curate_min_bank: 20
memory_curate_max_items: 60
memory_curate_min_keep_frac: 0.25
memory_max_lessons: 500
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_persist: true
memory_inject_mode: append
memory_token_budget: 1200
memory_grant_context: true
memory_arm_control_fraction: 0.0
memory_arm_explore_fraction: 0.0
memory_arm_max_lessons: 1
memory_arm_exploration_c: 0.5
memory_outcome_credit: false
memory_text_reinforce: true
memory_extract_from: both
memory_require_full_lessons: false
memory_temperature: 0.7
memory_top_p: 0.95
memory_use_gen_pool: true

# --- feedback defaults ---
feedback: false
feedback_lambda: 0.2
feedback_anneal_steps: 0
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 1200
feedback_max_per_step: 0
feedback_auto_fraction: 0.20
feedback_include_constant_groups: true
feedback_inject_mode: append
feedback_normalize: false
feedback_adaptive: false
feedback_validity_floor: 0.5
feedback_validity_target: 0.9
feedback_max_reward_ratio: 0.0
feedback_reward_scale_floor: 0.25
feedback_max_per_signature: 0
feedback_auto_signature_fraction: 0.25
