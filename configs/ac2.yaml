# Complete standalone configuration. No shared defaults file is merged.

# --- problem / routing ---
problem: ac2
problem_type: ac2
target: 0.97
fail_score: 0.0
budget_s: 1000
eval_cpus: 2

# --- model / QLoRA training ---
model_name: openai/gpt-oss-120b
training_model_name: ''
backend: unsloth
max_seq_length: 32000
load_in_4bit: true
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
training_gpu_id: 0
available_gpu_ids: ''
reserve_last_gpu_for_evaluation: false
evaluation_gpu_id: null
num_gpus: null
gpu_ids: ''
sequential_generation: false
evaluation_shares_generation: false

# --- generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_gpu_memory_utilization: auto
vllm_enforce_eager: false
vllm_enable_prefix_caching: true
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_quantization: ''
vllm_max_num_batched_tokens: auto
vllm_enable_expert_parallel: true

# --- optimization ---
num_steps: 50
groups_per_step: 8
group_size: 64
num_seed_states: 8
max_groups_per_step: null
max_group_size: null
growth_force_step: 10
growth_valid_yield: 0.7
growth_distinct_min: 4
growth_factor: 2.0
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
kl_penalty_coef: 0.1
grad_clip: 1.0
train_examples_per_microbatch: 64
logprob_chunk: auto

# --- search / PUCT ---
puct_c: 1.0
max_buffer_size: 1000
topk_children_per_parent: 8

# --- sampling ---
max_new_tokens: 26000
temperature: 1.0
top_p: 1.0
thinking: false
deterministic: false
seed: 42

# --- evaluation / logging ---
sandbox_timeout_s: 1100
reward_workers: 0
print_responses: 0
max_saved_construction: 4096

# --- memory ---
memory: false
memory_version: V1
memory_hygiene_profile: auto
memory_extract_mode: contrast
memory_lessons_per_call: 3
memory_max_examples_per_call: 8
memory_max_chars_per_example: 1500
memory_feedback_chars: 800
memory_max_new_tokens: 1024
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false
memory_lookup_mode: select
memory_lookup_max_select: 5
memory_lookup_fallback: none
memory_lookup_max_new_tokens: 256
memory_lookup_temperature: 0.3
memory_catalog_max_lessons: 0
memory_catalog_chars: 200
memory_curate_every: 0
memory_curate_min_bank: 20
memory_curate_max_items: 60
memory_curate_max_new_tokens: 4096
memory_curate_min_keep_frac: 0.25
memory_max_lessons: 500
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_persist: true
memory_inject_mode: append
memory_token_budget: 1200
memory_grant_context: true
memory_arm_control_fraction: 0.0
memory_arm_explore_fraction: 0.0
memory_arm_max_lessons: 1
memory_arm_exploration_c: 0.5
memory_arm_comparison_n: 0
memory_outcome_credit: false
memory_text_reinforce: true
memory_extract_from: both
memory_require_full_lessons: false
memory_temperature: 0.7
memory_top_p: 0.95
memory_use_gen_pool: true

# --- feedback ---
feedback: false
feedback_lambda: 0.2
feedback_anneal_steps: 0
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 1200
feedback_max_per_step: 0
feedback_auto_fraction: 0.2
feedback_include_constant_groups: true
feedback_inject_mode: append
feedback_normalize: false
feedback_adaptive: false
feedback_validity_floor: 0.5
feedback_validity_target: 0.9
feedback_max_reward_ratio: 0.0
feedback_reward_scale_floor: 0.25
feedback_max_per_signature: 0
feedback_auto_signature_fraction: 0.25


# --- Elo re-ranker (explicitly disabled) ---
reranker_enabled: false
reranker_backend: openai
reranker_model: Qwen/Qwen3-8B
reranker_base_url: ''
reranker_api_key: ''
reranker_api_key_env: RERANKER_API_KEY
reranker_temperature: 0.7
reranker_max_tokens: 2048
reranker_request_timeout_s: 120.0
reranker_judge_gpu: 5
reranker_judge_batch_size: 16
reranker_judge_load_in_4bit: false
reranker_top_p: 1.0
reranker_max_seq_length: 8192
reranker_top_k: 20
reranker_debate: true
reranker_tournament_mode: round_robin
reranker_num_random_matches: 60
reranker_both_orders: false
reranker_judge_concurrency: 4
reranker_max_code_chars: 4000
reranker_elo_init: 1200.0
reranker_elo_k: 24.0
reranker_elo_softmax_temp: 100.0
reranker_prior_weight: 1.0
reranker_poll_interval_s: 5.0
reranker_min_states_to_rank: 2
reranker_goal: ''
