# Complete standalone configuration. No shared defaults file is merged.

# --- problem / routing ---
problem: erdos
target: 0.380876
fail_score: 0.0
budget_s: 1100
eval_cpus: 185

# --- model / QLoRA training ---
# model_name:  /mnt/storage/mohammad/models/Qwen3-8B
# model_name:  /mnt/storage/mohammad/models/Qwen3-Coder-Next
model_name:  Qwen/Qwen3-8B
training_model_name: ''
# coder_model_name: Qwen/Qwen3-Coder-Next
# coder_model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct
# Large-coder profiles below are automatic. Changing only coder_model_name
# wires native context/output limits, the strongest supported reasoning mode,
# maximum safe rollout replicas, and exact long-context training:
# coder_model_name: openai/gpt-oss-120b
# coder_model_name: Qwen/Qwen3-30B-A3B-g-2507
# coder_model_name: Qwen/Qwen3.8-27B
coder_model_name: Qwen/Qwen3-8B
# vLLM uses one rollout engine per GPU. During adapter updates, Qwen3.8's
# automatic profile runs one complete BF16 LoRA trainer per GPU so rollout
# gradients are computed concurrently across all selected cards.
coder_training_model_name: ''
# strategy_model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
strategy_model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
# strategy_model_name: Qwen/Qwen3-8B
strategy_backend: local
backend: hf
# The three profiled coder choices above override this with their native
# context automatically (131,072 for GPT-OSS; 262,144 for both Qwen models).
# Other coders keep this explicit value.
max_seq_length: 32768
load_in_4bit: false
training_layout: replicated
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
# Initial verified-usability coder phase. The adapter remains active but is
# frozen after these steps; the configured scientific coder objective is not
# run while this mode is enabled.
binary_coder_training: false
binary_coder_init_steps: 4
binary_coder_lora_rank: 32
binary_coder_clip_epsilon_low: 0.2
# binary_coder_clip_epsilon_high: 0.38
binary_coder_clip_epsilon_high: 0.2
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
training_gpu_id: 0
available_gpu_ids: ''
reserve_last_gpu_for_evaluation: false
evaluation_gpu_id: null
num_gpus: null
gpu_ids: ''
sequential_generation: false
evaluation_shares_generation: false

# --- generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_gpu_memory_utilization: auto
vllm_enforce_eager: false
vllm_enable_prefix_caching: true
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_quantization: ''
vllm_max_num_batched_tokens: auto
vllm_enable_expert_parallel: false
# Level 1 keeps every coder engine's weights backed in host RAM while asleep.
vllm_sleep_level: 1
vllm_staged_loading: false
strategy_vllm_sleep_level: 1
# Previous 32B strategy pool retained only one worker between phases:
# strategy_vllm_persistent_workers: 1
# The profiled 8B strategist keeps every TP=1 replica backed in host RAM.
strategy_vllm_staged_loading: false

# --- optimization ---
num_steps: 50
groups_per_step: 4
group_size: 70
strategies_per_parent: 4
programs_per_strategy: 14
pilot_programs_per_strategy: 6
strategy_archive_top_r: 2
num_seed_states: 8
max_groups_per_step: null
max_group_size: null
growth_force_step: 10
growth_valid_yield: 0.7
growth_distinct_min: 4
growth_factor: 2.0
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
kl_penalty_coef: 0.1 # TTT
# kl_penalty_coef: 0.001
grad_clip: 1.0
train_examples_per_microbatch: 3
logprob_chunk: auto

# --- search / PUCT ---
puct_c: 1.0
max_buffer_size: 2000
topk_children_per_parent: 8

# --- sampling ---
# Profiled coders override this with their supported maximum. The runtime
# always caps generation by max_seq_length minus the actual coder prompt.
max_new_tokens: 32768
# max_new_tokens: 7000
# temperature: 0.6
temperature: 1
# top_p: 0.95
top_p: 1
thinking: true
# Permit the full native context as the output ceiling. Runtime subtracts the
# actual prompt length so prompt plus generated strategy remains within 128K.
strategy_max_new_tokens: 131072
strategy_max_seq_length: 131072
strategy_temperature: 0.6
strategy_top_p: 0.95
strategy_thinking: true
# Maximum runner effort; R1-0528 itself always reasons.
strategy_reasoning_effort: high
strategy_vllm_quantization: ''
deterministic: false
seed: 42

# --- evaluation / logging ---
# sandbox_timeout_s: 90
sandbox_timeout_s: 1150
reward_workers: 2
print_responses: 0
max_saved_construction: 8192

# --- feedback ---
feedback: false
feedback_lambda: 0.2
feedback_anneal_steps: 0
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 1200
feedback_max_per_step: 0
feedback_auto_fraction: 0.2
feedback_include_constant_groups: true
feedback_inject_mode: append
feedback_normalize: false
feedback_adaptive: true
feedback_validity_floor: 0.4
feedback_validity_target: 0.85
feedback_max_reward_ratio: 0.25
feedback_reward_scale_floor: 0.25
feedback_max_per_signature: 0
feedback_auto_signature_fraction: 0.25
