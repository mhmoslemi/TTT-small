# Complete standalone configuration. No shared defaults file is merged.

# --- problem / targets ---
problem: erdos
# Target shown in logs and used only for the NEW SOTA print comparison.
# Keep this separate from `target`, which is included in the model prompt.
target_print: 0.380868
target: 0.3808
fail_score: 0.0

# --- models / training backend ---
# model_name:  /mnt/storage/mohammad/models/Qwen3-8B
# model_name:  /mnt/storage/mohammad/models/Qwen3-Coder-Next
model_name:  Qwen/Qwen3-8B
training_model_name: ''
# Coder context/output limits are derived from the selected model.
# GPT-OSS uses low reasoning effort from its profile in train_multy_CVaR.py.
# coder_model_name: Qwen/Qwen3-Coder-Next
# coder_model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct
# Large-coder profiles supply context/output and reasoning defaults, rollout
# placement, and exact long-context training; explicit settings take precedence.
# Qwen3.8 can use a configured number of xhigh pilot rollouts per strategy;
# all remaining pilot and phase-2 rollouts retain the profile default effort.
# coder_model_name: Qwen/Qwen3.8-27B
# coder_model_name: Qwen/Qwen3-30B-A3B-Thinking-2507
coder_model_name: openai/gpt-oss-120b
# coder_model_name: Qwen/Qwen3-8B
# GPT-OSS uses native MXFP4 for vLLM rollouts and a separate trainable
# 4-bit checkpoint for LoRA updates. The runtime derives GPU placement.
coder_training_model_name: ''
# strategy_model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
strategy_model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
# Empty selects the local strategist above; set a model name to enable the API.
api_strategy: ''
# strategy_model_name: Qwen/Qwen3-8B
strategy_backend: local
backend: hf
load_in_4bit: true
training_layout: replicated

# --- LoRA adapters ---
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- rollout budget / strategy allocation ---
num_steps: 50
groups_per_step: 8
# groups_per_step: 4
# group_size: 68
group_size: 64
strategies_per_parent: 4
# strategies_per_parent: 4
# strategies_per_parent: 2
# programs_per_strategy: 17
programs_per_strategy: 8
# programs_per_strategy: 6
pilot_programs_per_strategy: 4
# pilot_programs_per_strategy: 10
# pilot_programs_per_strategy: 3
# Qwen3.8 only. Set to 0 to use the selected coder profile's default effort
# for every pilot and phase-2 sample.
pilot_xhigh_programs_per_strategy: 0
# rule_based = median mean/variance quadrants; bandit = Gaussian expected-best;
# hurdle = parent-improvement frequency + positive-gain distribution.
# All methods preserve the rollout budget. Ignored when pilot=-1.
phase2_allocation_method: hurdle

# --- search / PUCT / strategy archive ---
num_seed_states: 8
puct_c: 1.0
max_buffer_size: 2000
topk_children_per_parent: 8
strategy_archive_top_r: 2

# --- optimizer / training batches ---
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
grad_clip: 1.0
train_examples_per_microbatch: 3
logprob_chunk: auto

# --- advantage / regularization ---
kl_penalty_coef: 0.1 # TTT
# kl_penalty_coef: 0.001
# true: historical arctan shaping, 25% wider, with SPO moving average.
# false: original exp(beta * reward) SPO. Both train on every rollout.
spo_rs_adaptive_beta: false
spo_rs_beta: 2.0

# --- coder sampling ---
# Coder output may use the full remaining context after its actual prompt.
# temperature: 0.6
# top_p: 0.95
# 0 disables top-k filtering; min_p=0 disables minimum-probability filtering.
temperature: 1
top_p: 1
top_k: 0
min_p: 0
thinking: true

# --- strategy sampling / validation ---
strategy_max_seq_length: 131072
# Permit the full native context as the output ceiling. Runtime subtracts the
# actual prompt length so prompt plus generated strategy remains within 128K.
strategy_max_new_tokens: 131072
strategy_temperature: 1
strategy_top_p: 1
strategy_top_k: 0
strategy_min_p: 0
strategy_thinking: true
# Local R1-0528 always reasons; high is the local runner default label.
strategy_reasoning_effort: high
# Additional format retries; use a direct-solve fallback if all attempts fail.
strategy_format_max_retries: 3
# false restores the previous complete/non-empty <strategy> block validation.
strict_strategy_validation: false

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
available_gpu_ids: ''
training_gpu_id: 0
gpu_ids: ''
num_gpus: null
evaluation_gpu_id: null
reserve_last_gpu_for_evaluation: false
sequential_generation: false
evaluation_shares_generation: false

# --- coder generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: false
vllm_quantization: ''
vllm_gpu_memory_utilization: auto
vllm_max_num_batched_tokens: auto
vllm_enable_prefix_caching: true
vllm_enforce_eager: false
# Level 1 keeps every coder engine's weights backed in host RAM while asleep.
vllm_sleep_level: 1
vllm_staged_loading: false

# --- strategy generation engine ---
strategy_vllm_quantization: ''
strategy_vllm_sleep_level: 1
# Previous 32B strategy pool retained only one worker between phases:
# strategy_vllm_persistent_workers: 1
# The automatic planner matches strategist replicas to the live parent-chain
# frontier and uses TP/PP for otherwise-idle GPUs; all selected cards contribute.
strategy_vllm_staged_loading: false

# --- reproducibility ---
deterministic: false
seed: 42

# --- evaluation ---
budget_s: 1100
eval_cpus: 185
sandbox_timeout_s: 1150
reward_workers: 2

# --- logging / saved outputs ---
print_responses: 0
max_saved_construction: 81920

# temperature: controls randomness. Lower values concentrate probability on likely tokens; higher values increase diversity. 0.6 is moderately focused.
# top_k: retains only the k most probable tokens. 20 means all other tokens are excluded.
# top_p: retains the smallest group of tokens whose cumulative probability reaches p. 0.95 removes the unlikely tail.
# min_p: removes tokens whose probability is too small relative to the most probable token. 0 disables this filter.
# max_new_tokens: maximum number of output tokens; it does not include prompt tokens.
# thinking: true: enables the model’s reasoning mode through its chat template. It is separate from randomness.
# reasoning_effort: model-specific reasoning budget/control. It matters only for models that support that control.
