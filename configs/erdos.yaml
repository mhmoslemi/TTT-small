problem: erdos

# --- problem-specific ---
target: 0.380876               # current record C5 <= 0.38092; goal 0.38080
# Compute budget handed to the model's run(). The sandbox calls run() with NO
# arguments, so this number IS what executes. The original prompt hardcoded
# 1000s, which at 512 rollouts is 4-70 hours of evaluation per step depending
# on parallelism. Raise it once a step's wall clock is measured.
budget_s: 600
eval_cpus: 60                   # what the prompt tells the model it has
sandbox_timeout_s: 600          # headroom over budget_s: a program that respects
                               # its own clock returns a best-so-far instead of
                               # being killed by the harness with nothing

# --- model / backend ---
model_name: "Qwen/Qwen3-8B"
backend: auto

# --- RL ---
num_steps: 50
groups_per_step: 8
group_size: 64
max_new_tokens: 30000
temperature: 0.6
top_p: 0.95
thinking: true
deterministic: false

# --- generation ---
# The 8B model fits per card, so this is three independent vLLM replicas
# (TP=1) rather than one invalid TP=3 engine. GPU 0 remains trainer-only.
generation_backend: vllm
available_gpu_ids: "0,1,2,3"
training_gpu_id: 0
gpu_ids: "1,2,3"
vllm_tensor_parallel_size: 1
vllm_pipeline_parallel_size: 1

# --- memory (Sec. 2.2) ---
memory: true
memory_hygiene_profile: auto   # resolves to `geometry` from the problem name
memory_max_new_tokens: 4048
memory_lookup_max_select: 1       # one lesson/arm keeps outcome credit identifiable
memory_curate_every: 3
memory_max_lessons: 20
memory_token_budget: 3400

# Budget-neutral memory portfolio. Each parent still gets exactly K rollouts:
# 60% selected lesson, 20% null control, 20% under-tested UCB lesson.
memory_arm_control_fraction: 0.20
memory_arm_explore_fraction: 0.20
memory_arm_max_lessons: 1
memory_arm_exploration_c: 0.5
memory_outcome_credit: true
memory_text_reinforce: false      # mentions/paraphrases are not causal evidence

# --- feedback-based failure signal (Sec. 2.3) ---
feedback: true
feedback_adaptive: true
feedback_validity_floor: 0.40     # full strength below 40% code-valid
feedback_validity_target: 0.85    # off at/above 85% code-valid
feedback_max_reward_ratio: 0.25   # auxiliary advantage cannot dominate reward
feedback_reward_scale_floor: 0.25
