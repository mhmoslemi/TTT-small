problem: erdos

# --- problem-specific ---
target: 0.380876               # current record C5 <= 0.38092; goal 0.38080
# Compute budget handed to the model's run(). The sandbox calls run() with NO
# arguments, so this number IS what executes. The original prompt hardcoded
# 1000s, which at 512 rollouts is 4-70 hours of evaluation per step depending
# on parallelism. Raise it once a step's wall clock is measured.
budget_s: 100
eval_cpus: 10                   # what the prompt tells the model it has
sandbox_timeout_s: 120          # headroom over budget_s: a program that respects
                               # its own clock returns a best-so-far instead of
                               # being killed by the harness with nothing

# --- model / backend ---
model_name: "Qwen/Qwen3-8B"
backend: auto
max_seq_length: 32000

# --- reward evaluation ---
# 0 = auto (cpu_count - num_gpus). Correct here, unlike gpu_mode: the reward is
# a deterministic C5 bound, not a measured runtime, so concurrent evaluation
# costs speed under contention but cannot corrupt the score.
reward_workers: 0

# --- RL ---
num_steps: 30
groups_per_step: 8
group_size: 16                 # 128 rollouts/step
num_seed_states: 8
learning_rate: 4.0e-5
kl_penalty_coef: 0.1
# max_new_tokens: 6700
max_new_tokens: 30000
temperature: 1.0
top_p: 1.0

# --- generation ---
# Nothing needs a reserved GPU here, so both cards can generate.
num_gpus: 1
gpu_ids: "0"

# --- memory (Sec. 2.2) ---
memory: true
memory_hygiene_profile: auto   # resolves to `geometry` from the problem name
memory_extract_mode: contrast
memory_lessons_per_call: 3
memory_max_examples_per_call: 8
memory_max_chars_per_example: 1500
memory_feedback_chars: 800
memory_max_new_tokens: 4048
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false
memory_lookup_mode: select
memory_lookup_max_select: 1       # one lesson/arm keeps outcome credit identifiable
memory_lookup_fallback: none
memory_catalog_max_lessons: 0
memory_curate_every: 3
memory_curate_max_items: 60
memory_curate_min_keep_frac: 0.25
memory_max_lessons: 20
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_token_budget: 3400
memory_grant_context: true
memory_inject_mode: append

# Budget-neutral memory portfolio. Each parent still gets exactly K rollouts:
# 60% selected lesson, 20% null control, 20% under-tested UCB lesson.
memory_arm_control_fraction: 0.20
memory_arm_explore_fraction: 0.20
memory_arm_max_lessons: 1
memory_arm_exploration_c: 0.5
memory_outcome_credit: true
memory_text_reinforce: false      # mentions/paraphrases are not causal evidence

# --- feedback-based failure signal (Sec. 2.3) ---
feedback: true
feedback_lambda: 0.2
feedback_anneal_steps: 0          # validity controller replaces a blind time decay
feedback_anneal_shape: linear
feedback_lambda_final: 0.0
feedback_clip: 5.0
feedback_chars: 1200
feedback_max_per_step: 0          # auto: ceil(20% of current groups * group size)
feedback_inject_mode: append
feedback_adaptive: true
feedback_validity_floor: 0.50     # full strength below 50% valid
feedback_validity_target: 0.75    # off at/above 90% valid
feedback_max_reward_ratio: 0.25   # auxiliary advantage cannot dominate reward
feedback_reward_scale_floor: 0.25
feedback_max_per_signature: 0     # auto: ceil(25% of the per-step feedback cap)
