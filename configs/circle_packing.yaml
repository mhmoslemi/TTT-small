# --- memory (Sec. 2.2), lookup + contrastive extraction + curation ---
memory: true

# extraction
memory_extract_mode: contrast        # contrast | split
memory_lessons_per_call: 3           # ceiling per call, not a quota
memory_max_examples_per_call: 8
memory_max_chars_per_example: 1500
memory_feedback_chars: 800
memory_max_new_tokens: 2024

# generality guard
memory_forbid_constructions: true
memory_max_code_lines: 4
memory_global_scope_allows_code: false

# lookup (no embeddings)
memory_lookup_mode: select           # select | all | none
memory_lookup_max_select: 5
memory_lookup_fallback: none
memory_lookup_max_new_tokens: 256
memory_lookup_temperature: 0.3
memory_catalog_max_lessons: 0        # 0 = the model sees the whole bank
memory_catalog_chars: 200

# curation (whole-bank rewrite)
memory_curate_every: 5               # 0 disables
memory_curate_min_bank: 20
memory_curate_max_items: 60
memory_curate_min_keep_frac: 0.25

# bank
memory_max_lessons: 500
memory_dedup_jaccard: 0.6
memory_reinforce_delta: 0.15
memory_persist: true

# injection
memory_inject_mode: append           # ignored by circle_packing, which places it itself
memory_token_budget: 2400
memory_grant_context: true



