# Complete standalone configuration. No shared defaults file is merged.

# --- problem / routing ---
problem: ac1
problem_type: ac1
# Display/SOTA threshold. It is deliberately separate from the prompt target,
# even while both values are identical.
target_print: 1.50274349
target: 1.50274349
fail_score: 0.0
budget_s: 1100
eval_cpus: 185

# --- model / QLoRA training ---
model_name: Qwen/Qwen3-8B
training_model_name: ''
# Large-coder profiles supply context/output and reasoning defaults, rollout
# placement, and exact long-context training; explicit settings take precedence.
coder_model_name: Qwen/Qwen3.8-27B
coder_training_model_name: ''
strategy_model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
strategy_backend: local
backend: hf
# Coder context/output limits are derived from the selected model.
load_in_4bit: false
training_layout: replicated
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
binary_coder_training: false
binary_coder_init_steps: 4
binary_coder_lora_rank: 32
binary_coder_clip_epsilon_low: 0.2
binary_coder_clip_epsilon_high: 0.2
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
training_gpu_id: 0
available_gpu_ids: ''
reserve_last_gpu_for_evaluation: false
evaluation_gpu_id: null
num_gpus: null
gpu_ids: ''
sequential_generation: false
evaluation_shares_generation: false

# --- generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_gpu_memory_utilization: auto
vllm_enforce_eager: false
vllm_enable_prefix_caching: true
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_quantization: ''
vllm_max_num_batched_tokens: auto
vllm_enable_expert_parallel: false
vllm_sleep_level: 1
vllm_staged_loading: false
strategy_vllm_sleep_level: 1
strategy_vllm_staged_loading: false

# --- optimization ---
num_steps: 50
groups_per_step: 8
group_size: 64
strategies_per_parent: 4
programs_per_strategy: 16
pilot_programs_per_strategy: 11
# Qwen3.8 only: number of each strategy's pilot programs rendered at xhigh.
# Set to 0 to use the selected coder profile's default effort for every sample.
pilot_xhigh_programs_per_strategy: 2
# rule_based = median mean/variance quadrants; bandit = Gaussian expected-best;
# hurdle = parent-improvement frequency + positive-gain distribution.
phase2_allocation_method: hurdle
strategy_archive_top_r: 2
num_seed_states: 8
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
kl_penalty_coef: 0.1
spo_rs_adaptive_beta: false
spo_rs_beta: 2.0
grad_clip: 1.0
train_examples_per_microbatch: 3
logprob_chunk: auto

# --- search / PUCT ---
puct_c: 1.0
max_buffer_size: 2000
topk_children_per_parent: 8

# --- sampling ---
temperature: 1
top_p: 1
top_k: 0
min_p: 0
thinking: true
strategy_max_new_tokens: 131072
# Additional format retries; use a direct-solve fallback if all attempts fail.
strategy_format_max_retries: 3
strategy_max_seq_length: 131072
strategy_temperature: 1
strategy_top_p: 1
strategy_top_k: 0
strategy_min_p: 0
strategy_thinking: true
# Maximum runner effort; R1-0528 itself always reasons.
strategy_reasoning_effort: high
strategy_vllm_quantization: ''
deterministic: false
seed: 42

# --- evaluation / logging ---
sandbox_timeout_s: 1150
reward_workers: 2
print_responses: 0
max_saved_construction: 81920
