<div id="best-seen-by-step">
  <style>
    #best-seen-by-step {
      width: 100%;
      color: var(--foreground);
      font-family: var(--font-sans);
    }
    #best-seen-by-step h3 {
      margin: 0 0 8px;
      color: var(--foreground);
      font-size: 16px;
      font-weight: 600;
    }
    #best-seen-by-step svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #best-seen-by-step text {
      fill: var(--foreground);
      font-size: 12px;
    }
    #best-seen-by-step .axis path,
    #best-seen-by-step .axis line {
      stroke: var(--border);
    }
    #best-seen-by-step .grid line {
      stroke: var(--border);
      stroke-opacity: 0.55;
    }
    #best-seen-by-step .grid path {
      display: none;
    }
    #best-seen-by-step .annotation {
      font-size: 11px;
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--background);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    #best-seen-by-step .tooltip {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      display: none;
      padding: 6px 8px;
      border: 1px solid var(--border);
      background: var(--popover);
      color: var(--popover-foreground);
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
  <h3>Best Seen So Far by Step</h3>
  <div class="plot" style="position:relative"></div>
  <div class="tooltip" role="tooltip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById("best-seen-by-step");
  const plot = root.querySelector(".plot");
  const tooltip = root.querySelector(".tooltip");
  const values = [
    1.200000000, 1.200000000, 1.800000000, 2.217332079, 2.450000000,
    2.541421356, 2.541421356, 2.579193821, 2.616778184, 2.631093589,
    2.631093589, 2.631093589, 2.631093589, 2.635983085, 2.635983085,
    2.635983085, 2.635983085, 2.635983085, 2.635983085, 2.635983085,
    2.635983085, 2.635983085, 2.635983085, 2.635983085, 2.635983085
  ];
  const data = values.map((best, step) => ({ step, best }));
  const jumps = data.filter((d, i) => i === 0 || d.best > data[i - 1].best);
  const annotationOffsets = new Map([
    [0,  { dx: 9,  dy: -13, anchor: "start" }],
    [2,  { dx: -7, dy: -13, anchor: "end" }],
    [3,  { dx: 7,  dy: -12, anchor: "start" }],
    [4,  { dx: 7,  dy: -13, anchor: "start" }],
    [5,  { dx: -7, dy: 17,  anchor: "end" }],
    [7,  { dx: -7, dy: 33,  anchor: "end" }],
    [8,  { dx: -7, dy: -29, anchor: "end" }],
    [9,  { dx: 7,  dy: 17,  anchor: "start" }],
    [13, { dx: 7,  dy: -13, anchor: "start" }]
  ]);

  function draw() {
    plot.replaceChildren();
    const width = Math.max(320, Math.round(plot.getBoundingClientRect().width));
    const height = 410;
    const margin = { top: 28, right: 24, bottom: 54, left: 68 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const xExtent = d3.extent(data, d => d.step);
    const yExtent = d3.extent(data, d => d.best);
    const xPad = (xExtent[1] - xExtent[0]) * 0.025;
    const yPad = (yExtent[1] - yExtent[0]) * 0.09;
    const x = d3.scaleLinear()
      .domain([xExtent[0] - xPad, xExtent[1] + xPad])
      .range([0, innerWidth]);
    const y = d3.scaleLinear()
      .domain([yExtent[0] - yPad, yExtent[1] + yPad])
      .nice()
      .range([innerHeight, 0]);

    const svg = d3.select(plot).append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("role", "img")
      .attr("aria-label", "Step plot of best seen circle-packing score. The score rises from 1.2 at step 0 to 2.635983085 at step 13 and remains there through step 24.");
    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    g.append("rect")
      .attr("data-chart-frame", "")
      .attr("width", innerWidth)
      .attr("height", innerHeight)
      .attr("fill", "none")
      .attr("stroke", "var(--border)");

    const xTicks = width < 480 ? 4 : 9;
    g.append("g")
      .attr("class", "grid")
      .attr("transform", `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).ticks(xTicks).tickSize(-innerHeight).tickFormat(""));
    g.append("g")
      .attr("class", "grid")
      .call(d3.axisLeft(y).ticks(6).tickSize(-innerWidth).tickFormat(""));
    g.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).ticks(xTicks).tickFormat(d3.format("d")));
    g.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(6).tickFormat(d3.format(".2f")));

    svg.append("text")
      .attr("class", "axis-title")
      .attr("data-axis", "x")
      .attr("x", margin.left + innerWidth / 2)
      .attr("y", height - 9)
      .attr("text-anchor", "middle")
      .text("Step");
    svg.append("text")
      .attr("class", "axis-title")
      .attr("data-axis", "y")
      .attr("transform", `translate(17,${margin.top + innerHeight / 2}) rotate(-90)`)
      .attr("text-anchor", "middle")
      .text("Best seen so far (sum of radii)");

    const line = d3.line()
      .x(d => x(d.step))
      .y(d => y(d.best))
      .curve(d3.curveStepAfter);
    g.append("path")
      .datum(data)
      .attr("fill", "none")
      .attr("stroke", "var(--viz-series-1)")
      .attr("stroke-width", 2.5)
      .attr("d", line);

    g.selectAll("circle.observation")
      .data(data)
      .join("circle")
      .attr("class", "observation")
      .attr("cx", d => x(d.step))
      .attr("cy", d => y(d.best))
      .attr("r", 2.5)
      .attr("fill", "var(--viz-series-1)");

    g.selectAll("circle.jump")
      .data(jumps)
      .join("circle")
      .attr("class", "jump")
      .attr("cx", d => x(d.step))
      .attr("cy", d => y(d.best))
      .attr("r", 5)
      .attr("fill", "var(--viz-series-2)")
      .attr("stroke", "var(--background)")
      .attr("stroke-width", 1.5);

    const annotations = g.selectAll("g.jump-annotation")
      .data(jumps)
      .join("g")
      .attr("class", "jump-annotation");
    annotations.append("line")
      .attr("x1", d => x(d.step))
      .attr("y1", d => y(d.best))
      .attr("x2", d => x(d.step) + annotationOffsets.get(d.step).dx)
      .attr("y2", d => y(d.best) + annotationOffsets.get(d.step).dy)
      .attr("stroke", "var(--border)");
    annotations.append("text")
      .attr("class", "annotation")
      .attr("x", d => x(d.step) + annotationOffsets.get(d.step).dx)
      .attr("y", d => y(d.best) + annotationOffsets.get(d.step).dy)
      .attr("text-anchor", d => annotationOffsets.get(d.step).anchor)
      .attr("dominant-baseline", d => annotationOffsets.get(d.step).dy > 0 ? "hanging" : "auto")
      .text(d => `s${d.step}: ${d.best.toFixed(6)}`);

    g.selectAll("circle.hit")
      .data(data)
      .join("circle")
      .attr("class", "hit")
      .attr("cx", d => x(d.step))
      .attr("cy", d => y(d.best))
      .attr("r", 16)
      .attr("fill", "transparent")
      .on("pointerenter pointermove", (event, d) => {
        tooltip.style.display = "block";
        tooltip.textContent = `Step ${d.step}: ${d.best.toFixed(9)}`;
        const bounds = root.getBoundingClientRect();
        tooltip.style.left = `${event.clientX - bounds.left + 10}px`;
        tooltip.style.top = `${event.clientY - bounds.top - 32}px`;
      })
      .on("pointerleave", () => { tooltip.style.display = "none"; });
  }

  draw();
  new ResizeObserver(draw).observe(plot);
})();
</script>
