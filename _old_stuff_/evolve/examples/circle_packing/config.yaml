# Circle packing — pack n circles in the unit square, maximize the sum of radii.
#
# Applied above configs/base.yaml, below FRAMEWORK_OVERRIDES and the CLI.
# Only the keys that differ from base belong here.

example:
  name: circle_packing
  module: examples.circle_packing.env   # must expose build(cfg) -> Example

  # Free-form namespace: the framework passes this through untouched, so
  # problem knobs never leak into the framework's schema.
  params:
    num_circles: 26
    target: 2.635983          # 2.940 for n=32
    entrypoint: run_packing   # function the sandbox calls
    metric_name: "sum of radii"
    maximize: true

# Programs call scipy and can run a full optimization loop, so they need more
# wall clock than the framework default.
verifier:
  timeout_s: 100.0

search:
  n_select: 8
  k_children: 8               # B_t in [8, 64] per step
  num_seed_nodes: 1           # one empty root: "write a program from scratch"

generation:
  max_new_tokens: 4000
  temperature: 1.0

run:
  max_steps: 50
