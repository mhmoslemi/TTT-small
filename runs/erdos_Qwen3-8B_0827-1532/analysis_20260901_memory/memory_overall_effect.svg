<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17202A}
.title{font-size:30px;font-weight:750}.subtitle{font-size:17px;fill:#5D6D7E}
.panel{font-size:18px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#5D6D7E}
.tick{font-size:13px;fill:#475569}.value{font-size:14px;font-weight:700}.legend{font-size:14px;font-weight:650}
</style>
<text x="65.00" y="48.00" class="title" text-anchor="start">Selected memory improves feasibility, but not the maximum reliably</text>
<text x="65.00" y="76.00" class="subtitle" text-anchor="start">Within-run comparison: 264 parents, with a no-memory control generated from the same parent.</text>
<text x="80.00" y="128.00" class="panel" text-anchor="start">A. Outcome rates</text>
<line x1="95.00" y1="600.00" x2="855.00" y2="600.00" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="83.00" y="605.00" class="tick" text-anchor="end">0%</text>
<line x1="95.00" y1="504.44" x2="855.00" y2="504.44" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="83.00" y="509.44" class="tick" text-anchor="end">20%</text>
<line x1="95.00" y1="408.89" x2="855.00" y2="408.89" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="83.00" y="413.89" class="tick" text-anchor="end">40%</text>
<line x1="95.00" y1="313.33" x2="855.00" y2="313.33" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="83.00" y="318.33" class="tick" text-anchor="end">60%</text>
<line x1="95.00" y1="217.78" x2="855.00" y2="217.78" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="83.00" y="222.78" class="tick" text-anchor="end">80%</text>
<line x1="95.00" y1="170.00" x2="95.00" y2="600.00" stroke="#94A3B8" stroke-width="1" opacity="1.0"/>
<line x1="95.00" y1="600.00" x2="855.00" y2="600.00" stroke="#94A3B8" stroke-width="1" opacity="1.0"/>
<rect x="144.67" y="399.53" width="68.00" height="200.47" fill="#94A3B8" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="178.67" y="390.53" class="value" text-anchor="middle">42.0%</text>
<rect x="230.67" y="287.05" width="68.00" height="312.95" fill="#167D8D" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="264.67" y="278.05" class="value" text-anchor="middle">65.5%</text>
<text x="221.67" y="634.00" class="legend" text-anchor="middle">Scientifically valid</text>
<text x="221.67" y="657.00" class="small" text-anchor="middle" fill="#167D8D">memory effect +23.5 pp</text>
<rect x="398.00" y="245.56" width="68.00" height="354.44" fill="#94A3B8" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="432.00" y="236.56" class="value" text-anchor="middle">74.2%</text>
<rect x="484.00" y="209.23" width="68.00" height="390.77" fill="#167D8D" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="518.00" y="200.23" class="value" text-anchor="middle">81.8%</text>
<text x="475.00" y="634.00" class="legend" text-anchor="middle">Code-valid</text>
<text x="475.00" y="657.00" class="small" text-anchor="middle" fill="#167D8D">memory effect +7.6 pp</text>
<rect x="651.33" y="515.78" width="68.00" height="84.22" fill="#94A3B8" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="685.33" y="506.78" class="value" text-anchor="middle">17.6%</text>
<rect x="737.33" y="443.69" width="68.00" height="156.31" fill="#167D8D" opacity="1.0" rx="4" stroke="none" stroke-width="0"/>
<text x="771.33" y="434.69" class="value" text-anchor="middle">32.7%</text>
<text x="728.33" y="634.00" class="legend" text-anchor="middle">Beats its parent</text>
<text x="728.33" y="657.00" class="small" text-anchor="middle" fill="#167D8D">memory effect +15.1 pp</text>
<rect x="520.00" y="112.00" width="18.00" height="13.00" fill="#94A3B8" opacity="1.0" rx="2" stroke="none" stroke-width="0"/>
<text x="547.00" y="124.00" class="legend" text-anchor="start">no memory</text>
<rect x="650.00" y="112.00" width="18.00" height="13.00" fill="#167D8D" opacity="1.0" rx="2" stroke="none" stroke-width="0"/>
<text x="677.00" y="124.00" class="legend" text-anchor="start">selected lesson</text>
<text x="930.00" y="128.00" class="panel" text-anchor="start">B. Equal-budget scientific tail</text>
<text x="930.00" y="151.00" class="small" text-anchor="start">Mean best-of-13 reward difference versus no memory</text>
<line x1="979.00" y1="205.00" x2="979.00" y2="520.00" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="979.00" y="543.00" class="tick" text-anchor="middle">-0.10</text>
<line x1="1101.50" y1="205.00" x2="1101.50" y2="520.00" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="1101.50" y="543.00" class="tick" text-anchor="middle">-0.05</text>
<line x1="1224.00" y1="205.00" x2="1224.00" y2="520.00" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="1224.00" y="543.00" class="tick" text-anchor="middle">+0.00</text>
<line x1="1346.50" y1="205.00" x2="1346.50" y2="520.00" stroke="#E5E7EB" stroke-width="1" opacity="1.0"/>
<text x="1346.50" y="543.00" class="tick" text-anchor="middle">+0.05</text>
<line x1="1224.00" y1="197.00" x2="1224.00" y2="520.00" stroke="#17202A" stroke-width="2" opacity="1.0"/>
<text x="930.00" y="264.00" class="legend" text-anchor="start">selected lesson</text>
<line x1="1202.34" y1="295.00" x2="1396.60" y2="295.00" stroke="#167D8D" stroke-width="5" opacity="1.0"/>
<line x1="1202.34" y1="285.00" x2="1202.34" y2="305.00" stroke="#167D8D" stroke-width="3" opacity="1.0"/>
<line x1="1396.60" y1="285.00" x2="1396.60" y2="305.00" stroke="#167D8D" stroke-width="3" opacity="1.0"/>
<circle cx="1291.74" cy="295.00" r="9.00" fill="#167D8D" stroke="#FFFFFF" stroke-width="2"/>
<text x="930.00" y="331.00" class="small" text-anchor="start">mean +0.028; 95% CI [-0.009, +0.070]</text>
<text x="930.00" y="389.00" class="legend" text-anchor="start">UCB explore lesson</text>
<line x1="973.07" y1="420.00" x2="1296.90" y2="420.00" stroke="#8B5CF6" stroke-width="5" opacity="1.0"/>
<line x1="973.07" y1="410.00" x2="973.07" y2="430.00" stroke="#8B5CF6" stroke-width="3" opacity="1.0"/>
<line x1="1296.90" y1="410.00" x2="1296.90" y2="430.00" stroke="#8B5CF6" stroke-width="3" opacity="1.0"/>
<circle cx="1137.68" cy="420.00" r="9.00" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
<text x="930.00" y="456.00" class="small" text-anchor="start">mean -0.035; 95% CI [-0.102, +0.030]</text>
<rect x="925.00" y="585.00" width="500.00" height="82.00" fill="#F8FAFC" opacity="1.0" rx="8" stroke="#E2E8F0" stroke-width="1"/>
<text x="945.00" y="615.00" class="legend" text-anchor="start">Interpretation</text>
<text x="945.00" y="640.00" class="label" text-anchor="start">Memory clearly raises feasibility; both tail intervals cross zero.</text>
<text x="945.00" y="662.00" class="label" text-anchor="start">So this run does not show a reliable average gain in the maximum.</text>
<text x="80.00" y="718.00" class="small" text-anchor="start">Bootstrap intervals resample matched parent groups within this single run; they are not across-run confidence intervals.</text>
</svg>