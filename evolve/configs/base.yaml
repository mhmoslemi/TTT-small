# EVOLVE — framework-wide base settings.
#
# Lowest YAML layer: applied under every example's config.yaml, above the
# dataclass defaults in config.py. Put things here that are true for every
# example (model, hardware, logging). Anything example-specific belongs in
# examples/<name>/config.yaml.

example:
  name: circle_packing        # default target when --example is not passed

model:
  name: "Qwen/Qwen3-8B"
  backend: auto               # auto | unsloth | hf
  max_seq_length: 32000
  load_in_4bit: false
  lora_rank: 32
  lora_alpha: 32
  lora_dropout: 0.0

generation:
  max_new_tokens: 4000
  temperature: 1.0
  top_p: 1.0
  num_gpus: 1
  gpu_ids: ""

# --- §2.1 D-PUCT -----------------------------------------------------
search:
  n_select: 8                 # n
  k_children: 8               # k   -> B_t in [8, 64]
  c_puct: 1.0                 # c
  alpha: 0.5                  # α   rank vs Elo
  lambda_virtual: 1.0         # λ   virtual-child optimism
  tau: 1.0                    # τ   prior temperature
  normalize_exploitation: true
  selection_mode: node        # node | action_descend
  virtual_value_mode: zero    # zero | parent_mean
  max_archive_size: 1000
  num_seed_nodes: 1

elo:
  enabled: true
  k_factor: 24.0
  initial_rating: 0.0
  scale: 400.0                # paper writes 10^(E_j - E_i), i.e. 1.0
  pairing_mode: round_robin   # round_robin | random | neighbors
  num_matches: 60
  candidate_top_k: 16
  rounds_per_step: 1
  allow_ties: true
  judge_max_tokens: 1024
  judge_temperature: 0.7
  judge_batch_size: 8

# --- §2.2 memory -----------------------------------------------------
memory:
  enabled: true
  lessons_per_group: 3        # L -> 2L = 6 lessons per step
  top_m: 5                    # m
  embedding_backend: hash     # hash (no extra deps) | sentence_transformers | backbone
  max_bank_size: 0            # additive, unbounded
  extractor_max_tokens: 2048
  extractor_temperature: 0.7

# --- §2.3 test-time RL -----------------------------------------------
rl:
  enabled: true
  beta: 1.0                   # β  (0 gives exactly zero advantage)
  lambda_feedback: 0.5        # λ_f
  clip_epsilon: 0.2           # ε
  kl_coef: 0.1                # η_KL
  learning_rate: 1.0e-6
  grad_clip: 1.0
  updates_per_step: 1
  microbatch_size: 1
  use_feedback_signal: true
  advantage_clip: 10.0
  skip_degenerate_batches: true

verifier:
  timeout_s: 100.0
  max_cpus: 1
  feedback_max_chars: 2000
  fail_reward: 0.0

run:
  max_steps: 50
  seed: 42
  output_root: runs
  save_rollouts: true
  print_responses: 0
