<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 18 9 11l4 4 8-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="5" r="1.6" fill="currentColor"/></svg>
      <div><div class="brand-title">Run Explorer</div><div class="brand-sub" id="runName">loading…</div></div>
    </div>
    <div class="top-ctl">
      <button class="btn warnbtn" id="btnReset" hidden title="Some what-if parameters differ from the run's logged values - click to restore them">↺ reset what-ifs</button>
      <label class="ctl" title="Which published results are visible everywhere: papers only (default), plus the Einstein Arena leaderboard, plus unreviewed claims">Results
        <select id="gShow"></select>
      </label>
      <label class="ctl" title="The reference value drawn in the plots and used for every 'gap to reference' number">Reference
        <select id="gRef"></select>
      </label>
      <button class="btn" id="btnPlay" title="Play through the steps (space)">▶ play steps</button>
      <label class="ctl">Step
        <select id="gStep"></select>
      </label>
      <button class="btn" id="btnPrev" title="Previous step (←)">‹</button>
      <button class="btn" id="btnNext" title="Next step (→)">›</button>
      <button class="btn" id="btnTheme" title="Toggle light / dark">◐</button>
    </div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="main">
    <div id="loading" class="loading"><div class="spinner"></div><div>Inflating run data…</div></div>
  </main>
</div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><div id="drawerTitle">Program</div><button class="btn" id="drawerClose">✕</button></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="tip" class="tip" role="tooltip"></div>
<!--__DATA__-->
<script>
/*__JS__*/
</script>
</body>
</html>
