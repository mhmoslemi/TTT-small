[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dpuct"
version = "0.1.0"
description = "Max-seeking tree search (D-PUCT) you can drop into an existing MCTS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyter", "matplotlib"]

[tool.setuptools.packages.find]
include = ["dpuct*"]
